name: Generate Datas

on:
  schedule: # twice a day
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # publishes the generated image to the output branch
    steps:
      # Snake Animation
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        id: snake-gif
        with:
          github_user_name: brno01
          svg_out_path: dist/github-contribution-grid-snake.svg

      - uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
