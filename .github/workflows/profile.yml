name: profile

# Two jobs on purpose: the job that runs the repository's code and its dependencies
# (build) can only read; the job that writes to the output branch (publish) runs
# nothing from the repository, it only publishes what the first job produced, after a
# shell-only check that the artifact is exactly 82 flat, regular, lowercase-named .svg files.

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 9 * * *" # 06:17 in Brasilia
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r tools/requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: README is up to date
        run: python tools/build.py readme --check

      - name: Snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/snapshot.py --out snapshot.json

      - name: Generate the art
        run: python tools/build.py assets --snapshot snapshot.json --out dist

      - name: Upload the art
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # pushes the output branch
    steps:
      - name: Download the art
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: site

      # A new repository with a single commit, force-pushed to output: the branch never grows.
      - name: Publish to the output branch
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Only flat, regular, lowercase-named .svg files may be published: a .git directory,
          # a symlink, a subdirectory or any other file type fails the job.
          if find . -mindepth 1 \( ! -type f -o ! -regex '\./[a-z0-9][a-z0-9-]*\.svg' \) -print | grep -q .; then
            echo "::error::unexpected content in the artifact"; exit 1
          fi
          # 82 = (hero + 6 projects) in desktop/mobile x dark/light (28) + 27 icons (4 contacts, 23 stack) x light/dark (54), see tools/build.py
          [ "$(find . -type f | wc -l)" -eq 82 ] || { echo "::error::expected 82 files"; exit 1; }
          git init --quiet --initial-branch=output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet --message "Generate profile art"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" output:output
